<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>(function(){try{var t=localStorage.getItem("pixelpdf-theme");if(t==="light"||t==="dark"){document.documentElement.setAttribute("data-theme",t);}}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — PixelPDF</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="icon" href="logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
<style>
  body{ display:flex; flex-direction:column; min-height:100vh; }

  .center{
    flex:1; display:flex; align-items:center; justify-content:center;
    padding:48px 28px 72px;
    visibility:hidden;
  }
  body.ready .center{ visibility:visible; }

  /* Dieselbe Karte wie beim Login, dieselbe Geste beim Laden: die
     cyanfarbene Linie ueberstreicht sie einmal. */
  .auth-sheet{
    position:relative; overflow:hidden;
    width:100%; max-width:400px;
    background:var(--sheet); border:1px solid var(--rule-sheet);
    border-radius:3px; box-shadow:var(--sheet-shadow);
    padding:38px 34px 32px;
  }

  .auth-sheet h1{ font-size:24px; font-weight:700; margin-bottom:7px; }
  .auth-sub{ color:var(--ink-2); font-size:15px; margin-bottom:28px; }

  .hidden{ display:none; }

  #state-success{ text-align:center; }
  #state-success h1, #state-success .auth-sub{ text-align:center; }
  #state-success .auth-sub{ margin-bottom:0; }

  /* ---------- Erfolg: Haken zeichnet sich ein ----------
     Dieselbe Bewegungsidee wie ueberall sonst, nur diesmal zieht die
     Linie einen Haken statt eine Kante entlangzulaufen. */
  .success-check{ display:block; margin:4px auto 20px; width:56px; height:56px; }
  .success-check circle{
    fill:none; stroke:var(--cyan); stroke-width:1.5;
    stroke-dasharray:151; stroke-dashoffset:151;
    animation:draw-circle .5s cubic-bezier(.32,0,.2,1) forwards;
  }
  .success-check path{
    fill:none; stroke:var(--cyan); stroke-width:2.5;
    stroke-linecap:round; stroke-linejoin:round;
    stroke-dasharray:32; stroke-dashoffset:32;
    animation:draw-check .35s cubic-bezier(.32,0,.2,1) .45s forwards;
  }
  @keyframes draw-circle{ to{ stroke-dashoffset:0; } }
  @keyframes draw-check{ to{ stroke-dashoffset:0; } }
  @media (prefers-reduced-motion: reduce){
    .success-check circle, .success-check path{ animation:none; stroke-dashoffset:0; }
  }

  .auth-foot{
    text-align:center; padding:0 28px 40px;
    font-size:13px; color:var(--ink-3);
  }
  .auth-foot a:hover{ color:var(--ink); }
</style>
<noscript><style>.center{ visibility:visible; }</style></noscript>
</head>
<body>

<header class="site-head">
  <div class="wrap">
    <a href="index.html" class="brand">
      <svg class="brand-mark" width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M4.6 2.6h8.8l6 6v12.8h-14.8z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        <path d="M13.4 2.6v6h6" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        <rect x="7.6" y="12.4" width="3.2" height="3.2" fill="#00a3e0"/>
        <rect x="11.2" y="12.4" width="3.2" height="3.2" fill="#00a3e0" opacity=".45"/>
        <rect x="7.6" y="16" width="3.2" height="3.2" fill="#00a3e0" opacity=".45"/>
        <rect x="11.2" y="16" width="3.2" height="3.2" fill="#00a3e0"/>
      </svg>
      <span>PixelPDF</span>
    </a>
    <div class="head-actions">
      <a href="login.html" class="btn btn-quiet btn-small">Back to site</a>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-pressed="false" aria-label="Switch to dark theme">
        <svg class="theme-icon theme-icon-sun" width="13" height="13" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <circle cx="7" cy="7" r="3" fill="currentColor"/>
          <path d="M7 .8v2.1M7 11.1v2.1M13.2 7h-2.1M2.9 7H.8M11.4 2.6l-1.5 1.5M4.1 9.9l-1.5 1.5M11.4 11.4l-1.5-1.5M4.1 4.1L2.6 2.6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
        <svg class="theme-icon theme-icon-moon" width="13" height="13" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <path d="M12.6 8.5A5.6 5.6 0 1 1 5.5 1.4a4.5 4.5 0 0 0 7.1 7.1z" fill="currentColor"/>
        </svg>
        <span class="theme-thumb"></span>
      </button>
    </div>
  </div>
</header>

<div class="center">
  <div class="auth-sheet" id="auth-sheet">
    <div class="scanline"></div>

    <div id="state-form" class="hidden">
      <h1>Set a new password</h1>
      <p class="auth-sub">Make it at least 8 characters.</p>

      <div class="msg" id="message"></div>

      <form id="reset-form">
        <div class="field">
          <label for="new-password">New password</label>
          <div class="pw-wrap">
            <input type="password" id="new-password" required autocomplete="new-password" minlength="8">
            <button type="button" class="pw-toggle" aria-pressed="false" aria-label="Show password">
              <svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                <path d="M2 10c2.2-3.6 4.9-5.4 8-5.4s5.8 1.8 8 5.4c-2.2 3.6-4.9 5.4-8 5.4S4.2 13.6 2 10z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                <circle cx="10" cy="10" r="2.7" stroke="currentColor" stroke-width="1.5"/>
                <path class="pw-slash" d="M3.5 16.5 16.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="field">
          <label for="confirm-password">Confirm new password</label>
          <div class="pw-wrap">
            <input type="password" id="confirm-password" required autocomplete="new-password" minlength="8">
            <button type="button" class="pw-toggle" aria-pressed="false" aria-label="Show password">
              <svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                <path d="M2 10c2.2-3.6 4.9-5.4 8-5.4s5.8 1.8 8 5.4c-2.2 3.6-4.9 5.4-8 5.4S4.2 13.6 2 10z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                <circle cx="10" cy="10" r="2.7" stroke="currentColor" stroke-width="1.5"/>
                <path class="pw-slash" d="M3.5 16.5 16.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-solid btn-block" id="submit-btn">Set new password</button>
      </form>
    </div>

    <div id="state-success" class="hidden">
      <svg class="success-check" viewBox="0 0 56 56" fill="none" aria-hidden="true">
        <circle cx="28" cy="28" r="24"/>
        <path d="M18 28.5l7 7 13.5-14"/>
      </svg>
      <h1>Password updated</h1>
      <p class="auth-sub">Taking you to log in…</p>
    </div>

    <div id="state-invalid" class="hidden">
      <h1>Link expired</h1>
      <p class="auth-sub">This reset link is no longer valid. Request a new one from the log-in page.</p>
      <a href="login.html" class="btn btn-solid btn-block">Back to log in</a>
    </div>
  </div>
</div>

<footer class="auth-foot">
  © 2026 PixelPDF ·
  <a href="impressum.html">Imprint</a> ·
  <a href="datenschutz.html">Privacy Policy</a> ·
  <a href="agb.html">Terms</a>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase-client.js"></script>
<script src="theme.js"></script>
<script src="password-toggle.js"></script>
<script>
  const authSheet = document.getElementById("auth-sheet");
  const stateForm = document.getElementById("state-form");
  const stateSuccess = document.getElementById("state-success");
  const stateInvalid = document.getElementById("state-invalid");

  function showState(el){
    [stateForm, stateSuccess, stateInvalid].forEach((s) => {
      s.classList.toggle("hidden", s !== el);
    });
  }

  // Gleiche Reissleine wie auf login.html: die Karte bleibt unsichtbar, bis
  // eine Entscheidung getroffen ist, damit kein Zwischenzustand aufblitzt.
  let revealed = false;
  function reveal(){
    if (revealed) return;
    revealed = true;
    authSheet.classList.add("is-scanned");
    document.body.classList.add("ready");
  }

  let recoveryHandled = false;

  // Reissleine zuerst registrieren, unabhaengig davon ob das Supabase-SDK
  // laedt oder das PASSWORD_RECOVERY-Event jemals feuert.
  setTimeout(() => {
    if (!recoveryHandled) {
      showState(stateInvalid);
      reveal();
    }
  }, 1500);

  try {
    sb.auth.onAuthStateChange((event) => {
      if (event === "PASSWORD_RECOVERY" && !recoveryHandled) {
        recoveryHandled = true;
        showState(stateForm);
        reveal();
      }
    });
  } catch (e) {
    // sb nicht verfuegbar (CDN blockiert o.ae.) - die Reissleine oben uebernimmt.
  }

  const form = document.getElementById("reset-form");
  const newPasswordInput = document.getElementById("new-password");
  const confirmPasswordInput = document.getElementById("confirm-password");
  const submitBtn = document.getElementById("submit-btn");
  const messageBox = document.getElementById("message");

  function showMessage(text, type){
    messageBox.textContent = text;
    messageBox.className = "msg " + type;
  }
  function clearMessage(){
    messageBox.className = "msg";
    messageBox.textContent = "";
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    clearMessage();

    if (newPasswordInput.value !== confirmPasswordInput.value) {
      showMessage("Those passwords don't match.", "error");
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Updating…";

    try {
      const { error } = await sb.auth.updateUser({ password: newPasswordInput.value });
      if (error) throw error;
      showState(stateSuccess);
      setTimeout(() => { window.location.href = "login.html"; }, 2200);
    } catch (err) {
      showMessage(err.message || "Something went wrong. Please try again.", "error");
      submitBtn.disabled = false;
      submitBtn.textContent = "Set new password";
    }
  });
</script>
</body>
</html>
