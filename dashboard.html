<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>(function(){try{var t=localStorage.getItem("pixelpdf-theme");if(t==="light"||t==="dark"){document.documentElement.setAttribute("data-theme",t);}}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — PixelPDF</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="icon" href="logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
<style>
  .wrap{ max-width:900px; }

  main{ padding:44px 0 96px; }
  h1{ font-size:clamp(28px,3.6vw,38px); font-weight:800; margin-bottom:8px; }
  .page-sub{ color:var(--ink-2); font-size:16px; margin-bottom:40px; }

  .user-email{ font-family:var(--mono); font-size:12.5px; color:var(--ink-3); }

  /* ---------- Karten ---------- */
  .card{
    background:var(--sheet); border:1px solid var(--rule-sheet);
    border-radius:3px; box-shadow:var(--sheet-shadow);
    padding:26px 28px 28px; margin-bottom:20px;
  }
  .card > .spec{ display:block; margin-bottom:16px; }

  .row-2{ display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  .row-2 .card{ margin-bottom:0; }

  /* ---------- Der API-Key ist der Grund, warum man hier ist:
       deshalb steht er oben und bekommt den meisten Platz. ---------- */
  .key-strip{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    background:var(--well); border:1px solid var(--rule);
    border-radius:2px; padding:14px 16px;
  }
  .key-value{
    flex:1 1 240px; min-width:0;
    font-family:var(--mono); font-size:15px; letter-spacing:.02em; color:var(--ink);
    overflow-x:auto; white-space:nowrap; background:none; padding:0;
  }
  .key-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .key-btn{
    background:var(--sheet); border:1px solid var(--rule); color:var(--ink-2);
    padding:8px 14px; border-radius:2px; cursor:pointer;
    font-family:var(--display); font-stretch:112%; font-weight:600; font-size:13px;
    transition:border-color .15s ease, color .15s ease;
  }
  .key-btn:hover{ border-color:var(--ink); color:var(--ink); }
  .key-btn.danger:hover{ border-color:var(--alert); color:var(--alert); }
  .key-btn:disabled{ opacity:.55; cursor:default; }
  .key-hint{ font-size:13px; color:var(--ink-3); margin-top:14px; }
  .key-hint strong{ color:var(--ink-2); font-weight:600; }

  /* ---------- Zahlen ---------- */
  .stat{
    font-stretch:125%; font-weight:800; font-size:44px; letter-spacing:-.03em;
    line-height:1; margin-bottom:6px;
  }
  .stat small{
    font-stretch:100%; font-size:16px; font-weight:500;
    color:var(--ink-3); letter-spacing:0;
  }
  .stat-label{ color:var(--ink-2); font-size:14px; }

  .track{ height:6px; background:var(--bed-deep); border-radius:1px; overflow:hidden; margin-top:16px; }
  .fill{ height:100%; background:var(--cyan); width:0; transition:width .9s cubic-bezier(.2,.6,.2,1); }

  .plan-name{ font-stretch:125%; font-weight:800; font-size:32px; letter-spacing:-.02em; line-height:1; }
  .plan-note{ color:var(--ink-2); font-size:14px; margin-top:8px; }
  .manage-link{
    display:inline-block; margin-top:14px; font-size:13.5px;
    color:var(--cyan-ink); text-decoration:underline; text-underline-offset:3px; cursor:pointer;
  }
  .manage-link:hover{ color:var(--ink); }

  /* ---------- Upgrade ---------- */
  .upgrade{
    background:var(--ink); color:var(--on-ink); border:1px solid var(--ink);
    border-radius:3px; box-shadow:var(--sheet-shadow);
    padding:28px 30px; margin-top:20px;
    display:flex; align-items:center; justify-content:space-between; gap:24px; flex-wrap:wrap;
  }
  .upgrade h3{ font-size:19px; font-weight:700; margin-bottom:6px; }
  .upgrade p{ color:var(--on-ink-2); font-size:14.5px; max-width:46ch; }

  .section-label{ margin:40px 0 16px; display:block; }

  .loading, .error-state{ padding:100px 0; text-align:center; color:var(--ink-2); }
  .error-state{ color:var(--alert); }

  .banner{
    font-size:14px; padding:13px 16px; border-radius:2px; margin-bottom:28px;
    background:var(--cyan-wash); border-left:3px solid var(--cyan); color:var(--cyan-ink);
  }

  .steps{ margin-bottom:20px; }
  .notes{ margin-top:2px; }

  @media (max-width:680px){
    .row-2{ grid-template-columns:1fr; }
    .user-email{ display:none; }
    main{ padding:32px 0 72px; }
  }
</style>
</head>
<body>

<header class="site-head">
  <div class="wrap">
    <a href="index.html" class="brand">
      <svg class="brand-mark" width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M4.6 2.6h8.8l6 6v12.8h-14.8z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        <path d="M13.4 2.6v6h6" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        <rect x="7.6" y="12.4" width="3.2" height="3.2" fill="#00a3e0"/>
        <rect x="11.2" y="12.4" width="3.2" height="3.2" fill="#00a3e0" opacity=".45"/>
        <rect x="7.6" y="16" width="3.2" height="3.2" fill="#00a3e0" opacity=".45"/>
        <rect x="11.2" y="16" width="3.2" height="3.2" fill="#00a3e0"/>
      </svg>
      <span>PixelPDF</span>
    </a>
    <div class="head-actions">
      <span class="user-email" id="user-email"></span>
      <button class="btn btn-quiet btn-small" id="logout-btn">Log out</button>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-pressed="false" aria-label="Switch to dark theme">
        <svg class="theme-icon theme-icon-sun" width="13" height="13" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <circle cx="7" cy="7" r="3" fill="currentColor"/>
          <path d="M7 .8v2.1M7 11.1v2.1M13.2 7h-2.1M2.9 7H.8M11.4 2.6l-1.5 1.5M4.1 9.9l-1.5 1.5M11.4 11.4l-1.5-1.5M4.1 4.1L2.6 2.6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
        <svg class="theme-icon theme-icon-moon" width="13" height="13" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <path d="M12.6 8.5A5.6 5.6 0 1 1 5.5 1.4a4.5 4.5 0 0 0 7.1 7.1z" fill="currentColor"/>
        </svg>
        <span class="theme-thumb"></span>
      </button>
    </div>
  </div>
</header>

<main class="wrap" id="main-content">
  <div class="loading" id="loading">Loading your dashboard…</div>
</main>

<footer class="site-foot">
  <div class="wrap">
    <div>© 2026 PixelPDF</div>
    <div class="foot-links">
      <a href="index.html">Home</a>
      <a href="impressum.html">Imprint</a>
      <a href="datenschutz.html">Privacy Policy</a>
      <a href="agb.html">Terms</a>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase-client.js"></script>
<script src="theme.js"></script>
<script>
  const FAIR_USE_LIMIT_PRO = 2000;
  const mainContent = document.getElementById("main-content");
  const userEmailEl = document.getElementById("user-email");

  const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // Zahlen zaehlen beim Laden hoch. Bei reduzierter Bewegung steht der Wert
  // sofort da, damit niemand auf eine Animation warten muss.
  function countUp(el, target){
    if (prefersReducedMotion || target <= 0) { el.textContent = target; return; }
    const duration = 700;
    const start = performance.now();
    function frame(now){
      const t = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - t, 3);
      el.textContent = Math.round(target * eased);
      if (t < 1) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  function renderDashboard(profile, email){
    userEmailEl.textContent = email;

    const isPro = profile.plan === "pro";
    const planLabel = isPro ? "Pro" : "Free";

    let usageCardHtml;
    if (isPro) {
      usageCardHtml = `
        <span class="spec">Used this month</span>
        <div class="stat"><span id="stat-number">0</span> <small>/ ${FAIR_USE_LIMIT_PRO}</small></div>
        <div class="stat-label">conversions against the fair-use limit</div>
        <div class="track"><div class="fill" id="usage-fill"></div></div>
      `;
    } else {
      usageCardHtml = `
        <span class="spec">Credits left</span>
        <div class="stat"><span id="stat-number">0</span></div>
        <div class="stat-label">conversions remaining</div>
      `;
    }

    const justUpgraded = new URLSearchParams(window.location.search).get("upgraded") === "1";
    const bannerHtml = !justUpgraded ? "" : isPro
      ? `<div class="banner">You're on Pro now. Thanks.</div>`
      : `<div class="banner">Payment received, syncing with Stripe. If this still shows Free, refresh in a few seconds.</div>`;

    const upgradeHtml = isPro ? "" : `
      <div class="upgrade rise rise-4">
        <div>
          <h3>Go Pro for €5 a month</h3>
          <p>Unlimited conversions, with a fair-use limit of ${FAIR_USE_LIMIT_PRO} per month. Cancel any time.</p>
        </div>
        <button class="btn btn-invert" id="upgrade-btn">Go Pro</button>
      </div>
    `;

    mainContent.innerHTML = `
      <h1>Dashboard</h1>
      <p class="page-sub">Your key, your plan, and how to drop it into Make or Zapier.</p>

      ${bannerHtml}

      <div class="card rise">
        <span class="spec">Your API key</span>
        <div class="key-strip">
          <code class="key-value" id="api-key-value">${"•".repeat(32)}</code>
          <div class="key-actions">
            <button class="key-btn" id="toggle-key-btn" type="button">Show</button>
            <button class="key-btn" id="copy-key-btn" type="button">Copy</button>
            <button class="key-btn danger" id="regenerate-key-btn" type="button">Regenerate</button>
          </div>
        </div>
        <p class="key-hint">
          You can copy it without revealing it. Keep it secret: anyone holding this key can
          spend your conversions. If it ever leaks, <strong>Regenerate</strong> replaces it immediately.
        </p>
      </div>

      <div class="row-2">
        <div class="card rise rise-2">
          <span class="spec">Plan</span>
          <div class="plan-name">${planLabel}</div>
          <p class="plan-note">${isPro ? "€5 per month, renews automatically." : "200 free conversions, one time."}</p>
          ${isPro ? `<a href="#" id="manage-billing-link" class="manage-link">Manage subscription</a>` : ""}
        </div>
        <div class="card rise rise-3">
          ${usageCardHtml}
        </div>
      </div>

      <span class="spec section-label">Quickstart</span>

      <ol class="steps">
        <li class="step"><span>Copy your key above. You do not need to reveal it first.</span></li>
        <li class="step"><span>In your scenario, add an <strong>HTTP → Make a request</strong> module set to <code>POST</code>.</span></li>
        <li class="step"><span>Point it at <code>${API_BASE_URL}/convert</code> and add the header <code>X-API-Key</code> with your key.</span></li>
        <li class="step"><span>Attach your PDF as a <code>file</code> field using <code>multipart/form-data</code>, then run it.</span></li>
      </ol>

<pre class="codeblock"><span class="m">POST</span> ${API_BASE_URL}/convert

X-API-Key:    <span class="v">your_api_key</span>
Content-Type: multipart/form-data

file:         <span class="v">your_file.pdf</span></pre>

      <div class="notes">
        <div class="note"><span class="spec">Output</span><span>One page returns a <code>PNG</code>. More than one page returns a <code>ZIP</code> holding one PNG per page.</span></div>
        <div class="note"><span class="spec">Limits</span><span>Up to 5 pages and 10&nbsp;MB per file. Anything larger comes back as <code>413</code>.</span></div>
        <div class="note"><span class="spec">If it fails</span><span><code>402</code> means your free credits are used up. <code>429</code> means the Pro fair-use limit is reached.</span></div>
      </div>

      ${upgradeHtml}
    `;

    // Zahlen und Balken erst nach dem Einsetzen ins DOM animieren.
    const statNumber = document.getElementById("stat-number");
    if (statNumber) countUp(statNumber, isPro ? (profile.monthly_usage || 0) : profile.credits_remaining);

    const usageFill = document.getElementById("usage-fill");
    if (usageFill) {
      const pct = Math.min(100, ((profile.monthly_usage || 0) / FAIR_USE_LIMIT_PRO) * 100);
      if (prefersReducedMotion) {
        usageFill.style.transition = "none";
        usageFill.style.width = pct + "%";
      } else {
        requestAnimationFrame(() => { usageFill.style.width = pct + "%"; });
      }
    }

    let keyVisible = false;
    const keyValueEl = document.getElementById("api-key-value");
    const toggleKeyBtn = document.getElementById("toggle-key-btn");

    // Der Key wischt von links herein, dieselbe Geste wie der Scan auf der
    // Startseite: die cyanfarbene Linie macht etwas sichtbar.
    function setKeyText(text){
      keyValueEl.textContent = text;
      if (prefersReducedMotion) return;
      keyValueEl.classList.remove("wipe");
      void keyValueEl.offsetWidth;
      keyValueEl.classList.add("wipe");
    }

    toggleKeyBtn.addEventListener("click", () => {
      keyVisible = !keyVisible;
      setKeyText(keyVisible ? profile.api_key : "•".repeat(32));
      toggleKeyBtn.textContent = keyVisible ? "Hide" : "Show";
    });

    document.getElementById("copy-key-btn").addEventListener("click", () => {
      navigator.clipboard.writeText(profile.api_key);
      const btn = document.getElementById("copy-key-btn");
      btn.textContent = "Copied";
      setTimeout(() => { btn.textContent = "Copy"; }, 1500);
    });

    // Neuen Key anfordern. Der Schreibzugriff läuft über die API, nicht über Supabase direkt:
    // der Browser darf laut RLS nicht in "profiles" schreiben.
    const regenerateBtn = document.getElementById("regenerate-key-btn");
    regenerateBtn.addEventListener("click", async () => {
      const confirmed = confirm(
        "Create a new API key?\n\n" +
        "Your current key stops working immediately. Any Make or Zapier scenario still using " +
        "it will fail until you paste the new key in."
      );
      if (!confirmed) return;

      regenerateBtn.disabled = true;
      regenerateBtn.textContent = "Working…";
      try {
        const { data: { session } } = await sb.auth.getSession();
        const res = await fetch(`${API_BASE_URL}/account/regenerate-api-key`, {
          method: "POST",
          headers: { Authorization: `Bearer ${session.access_token}` },
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Could not create a new key.");

        profile.api_key = data.api_key;
        keyVisible = true;                       // neuen Key direkt zeigen, er muss ja kopiert werden
        setKeyText(profile.api_key);
        toggleKeyBtn.textContent = "Hide";
        regenerateBtn.textContent = "New key ready";
      } catch (err) {
        alert(err.message || "Something went wrong. Please try again.");
        regenerateBtn.textContent = "Regenerate";
      } finally {
        setTimeout(() => {
          regenerateBtn.textContent = "Regenerate";
          regenerateBtn.disabled = false;
        }, 2500);
      }
    });

    const upgradeBtn = document.getElementById("upgrade-btn");
    if (upgradeBtn) {
      upgradeBtn.addEventListener("click", async () => {
        upgradeBtn.disabled = true;
        upgradeBtn.textContent = "Redirecting…";
        try {
          const { data: { session } } = await sb.auth.getSession();
          const res = await fetch(`${API_BASE_URL}/billing/create-checkout-session`, {
            method: "POST",
            headers: { Authorization: `Bearer ${session.access_token}` },
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || "Could not start checkout.");
          window.location.href = data.url;
        } catch (err) {
          alert(err.message || "Something went wrong starting checkout. Please try again.");
          upgradeBtn.disabled = false;
          upgradeBtn.textContent = "Go Pro";
        }
      });
    }

    const manageLink = document.getElementById("manage-billing-link");
    if (manageLink) {
      manageLink.addEventListener("click", async (e) => {
        e.preventDefault();
        const originalText = manageLink.textContent;
        manageLink.textContent = "Loading…";
        try {
          const { data: { session } } = await sb.auth.getSession();
          const res = await fetch(`${API_BASE_URL}/billing/create-portal-session`, {
            method: "POST",
            headers: { Authorization: `Bearer ${session.access_token}` },
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || "Could not open the billing portal.");
          window.location.href = data.url;
        } catch (err) {
          alert(err.message || "Something went wrong. Please try again.");
          manageLink.textContent = originalText;
        }
      });
    }
  }

  async function init(){
    const { data: { session } } = await sb.auth.getSession();
    if (!session) {
      window.location.href = "login.html";
      return;
    }

    const { data: profile, error } = await sb
      .from("profiles")
      .select("api_key, plan, credits_remaining, monthly_usage")
      .eq("id", session.user.id)
      .single();

    if (error || !profile) {
      mainContent.innerHTML = `<div class="error-state">Couldn't load your profile: ${error ? error.message : "no profile found"}</div>`;
      return;
    }

    renderDashboard(profile, session.user.email);
  }

  document.getElementById("logout-btn").addEventListener("click", async () => {
    await sb.auth.signOut();
    window.location.href = "login.html";
  });

  init();
</script>
</body>
</html>
